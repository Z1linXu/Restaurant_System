worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name pos.allonouilles.com;
        client_max_body_size 4m;
        location = /healthz { default_type text/plain; return 200 'nginx-up\n'; }
        location /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
        # Bootstrap ACME only; expose login/application after TLS is installed.
        location / { return 503 'HTTPS setup in progress\n'; }
    }
}
