worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name pos.allonouilles.com;
        location = /healthz { default_type text/plain; return 200 'nginx-up\n'; }
        location /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
        location / { return 308 https://pos.allonouilles.com$request_uri; }
    }
    server {
        listen 8443 ssl;
        server_name pos.allonouilles.com;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:AlloTLS:1m;
        ssl_session_timeout 1d;
        if ($host != pos.allonouilles.com) { return 421; }
        if ($ssl_server_name != pos.allonouilles.com) { return 421; }
        client_max_body_size 4m;
        root /usr/share/nginx/html;
        location = /healthz { default_type text/plain; return 200 'nginx-up\n'; }
        # Requires the opt-in authenticated STOMP compatibility adapter.
        location /ws {
            if ($http_origin !~ "^(https://pos\.allonouilles\.com|https://restaurant-pad\.local)?$") { return 403; }
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host pos.allonouilles.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host pos.allonouilles.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-Prefix '';
            proxy_set_header X-Forwarded-Ssl '';
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location ^~ /actuator { return 404; }
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host pos.allonouilles.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host pos.allonouilles.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-Prefix '';
            proxy_set_header X-Forwarded-Ssl '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
        location = /index.html { add_header Cache-Control 'no-store' always; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
