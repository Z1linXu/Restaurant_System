# Append after the unchanged Production HTTP default server.
server {
    listen 80;
    server_name staging-pos.lanzhounoodlesmtl.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 308 https://staging-pos.lanzhounoodlesmtl.com$request_uri;
    }
}
