# Dedicated host-network proxy. No bind on public interfaces or Production ports.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 172.18.0.1:18480;
        server_name staging-pos.lanzhounoodlesmtl.com;
        allow 172.18.0.4;
        deny all;
        if ($host != staging-pos.lanzhounoodlesmtl.com) { return 421; }
        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host staging-pos.lanzhounoodlesmtl.com;
            proxy_set_header X-Forwarded-Host staging-pos.lanzhounoodlesmtl.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
