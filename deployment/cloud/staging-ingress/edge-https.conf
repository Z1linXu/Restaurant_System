# Only Staging is enabled on 443. Unknown SNI is rejected before HTTP.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 421;
}
server {
    listen 443 ssl;
    server_name staging-pos.lanzhounoodlesmtl.com;
    ssl_certificate /etc/letsencrypt/live/staging-pos.lanzhounoodlesmtl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-pos.lanzhounoodlesmtl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StagingSSL:1m;
    ssl_session_timeout 1d;
    if ($ssl_server_name != staging-pos.lanzhounoodlesmtl.com) { return 421; }
    if ($host != staging-pos.lanzhounoodlesmtl.com) { return 421; }
    location / {
        proxy_pass http://172.18.0.1:18480;
        proxy_http_version 1.1;
        proxy_set_header Host staging-pos.lanzhounoodlesmtl.com;
        proxy_set_header X-Forwarded-Host staging-pos.lanzhounoodlesmtl.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
