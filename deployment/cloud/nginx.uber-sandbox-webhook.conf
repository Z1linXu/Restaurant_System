# Temporary Sandbox tunnel origin. Only this signed webhook is public.
# Runs as a separate non-root sidecar; never loaded by Production nginx.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;
    client_body_timeout 10s;
    server {
        listen 127.0.0.1:18081;
        location = /api/v1/integrations/uber-eats/webhook {
            if ($request_method != POST) { return 405; }
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host localhost;
            proxy_set_header X-Uber-Signature $http_x_uber_signature;
            proxy_set_header X-Environment $http_x_environment;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
        location / { return 404; }
    }
}
