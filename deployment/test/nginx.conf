worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name test.lanzhounoodlesmtl.com;
        client_max_body_size 4m;
        root /usr/share/nginx/html;
        location = /test-health { return 200 'test-frontend-up\n'; }
        location = /test-code-sha { default_type text/plain; try_files $uri =404; }
        # F31 is not fixed by this release. Do not expose its broker on Test.
        location ^~ /ws { return 403; }
        location ^~ /actuator { return 404; }
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host test.lanzhounoodlesmtl.com;
            proxy_set_header X-Forwarded-Host test.lanzhounoodlesmtl.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location = /index.html { add_header Cache-Control 'no-store' always; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
